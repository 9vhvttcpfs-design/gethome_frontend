workflows:
  android-workflow:
    name: GetHome Android
    max_build_duration: 60
    environment:
      android_signing:
        - online.gethome
      vars:
        PROJECT_DIR: ".--"
        PACKAGE_NAME: online.trygethome.app
      node: 22.13.0
      java: 21
    cache:
      cache_paths:
        - $CM_BUILD_DIR/$PROJECT_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npm ci
      - name: Build Vite web app
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npm run build
      - name: Capacitor sync
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npx cap sync android
      - name: Build Android release bundle and APK
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR/android"
          chmod +x ./gradlew
          ./gradlew bundleRelease assembleRelease
    artifacts:
      - $CM_BUILD_DIR/$PROJECT_DIR/android/app/build/outputs/**/*.aab
      - $CM_BUILD_DIR/$PROJECT_DIR/android/app/build/outputs/**/*.apk
      - $CM_BUILD_DIR/$PROJECT_DIR/android/app/build/outputs/**/mapping.txt

  ios-workflow:
    name: GetHome iOS
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic Integration
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: online.trygethome.app
      vars:
        PROJECT_DIR: ".--"
        BUNDLE_ID: online.trygethome.app
        XCODE_SCHEME: App
        XCODE_WORKSPACE: ios/App/App.xcodeproj/project.xcworkspace
      node: 22.13.0
      xcode: 26.4
    cache:
      cache_paths:
        - $CM_BUILD_DIR/$PROJECT_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npm ci
      - name: Build Vite web app
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npm run build
      - name: Capacitor sync
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npx cap sync ios
      - name: Set bundle version
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR/ios/App"
          # The ASC commands need the numeric Apple app ID, not the bundle ID
          APP_ID=$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])') || APP_ID=""
          echo "Apple app ID: ${APP_ID:-<not found>}"

          LATEST_BUILD=0
          if [ -n "$APP_ID" ]; then
            LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_ID" || echo "0")
          fi
          LATEST_BUILD=${LATEST_BUILD:-0}
          echo "Latest uploaded build number: $LATEST_BUILD"

          # Never go below Codemagic's own build counter, in case the lookup fails
          NEW_BUILD=$(( LATEST_BUILD + 1 ))
          if [ "${BUILD_NUMBER:-0}" -gt "$NEW_BUILD" ]; then NEW_BUILD=$BUILD_NUMBER; fi
          echo "Using build number: $NEW_BUILD"

          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" App.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = $NEW_BUILD;" App.xcodeproj/project.pbxproj \
            || { echo "Failed to set build number"; exit 1; }
      - name: Set up code signing settings on Xcode project
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          xcode-project use-profiles
      - name: Build IPA and inspect archive
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          ARCHIVE_PATH="build/ios/xcarchive/App.xcarchive"

          set +e
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-directory "build/ios/xcarchive" \
            --archive-flags "-destination generic/platform=iOS" \
            --ipa-directory "build/ios/ipa"
          BUILD_STATUS=$?
          set -e

          echo "=== Archive Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" "$ARCHIVE_PATH/Info.plist" || echo "(archive Info.plist not found)"

          echo "=== Archive contents ==="
          find "$ARCHIVE_PATH/Products/Applications" -maxdepth 2 -print 2>&1 || echo "(archive Products/Applications not found)"

          echo "=== App Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" \
            "$ARCHIVE_PATH/Products/Applications/App.app/Info.plist" || echo "(app Info.plist not found)"

          exit $BUILD_STATUS
    artifacts:
      - $CM_BUILD_DIR/$PROJECT_DIR/build/ios/xcarchive/**
      - $CM_BUILD_DIR/$PROJECT_DIR/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

workflows:
  ios-workflow:
    name: GetHome iOS
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic Integration
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: online.trygethome.app
      vars:
        PROJECT_DIR: ".--"
        BUNDLE_ID: online.trygethome.app
        XCODE_SCHEME: App
        XCODE_WORKSPACE: ios/App/App.xcodeproj/project.xcworkspace
      node: 22.13.0
      xcode: 16.3
    cache:
      cache_paths:
        - $CM_BUILD_DIR/$PROJECT_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npm ci
      - name: Build Vite web app
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npm run build
      - name: Capacitor sync
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npx cap sync ios
      - name: Set bundle version
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR/ios/App"
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST_BUILD + 1))
      - name: Set up code signing settings on Xcode project
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          xcode-project use-profiles
      - name: Build IPA
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          mkdir -p build/ios/xcarchive build/ios/ipa
          xcodebuild archive \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -archivePath "build/ios/xcarchive/App.xcarchive" \
            -destination "generic/platform=iOS" \
            SKIP_INSTALL=NO
          xcodebuild -exportArchive \
            -archivePath "build/ios/xcarchive/App.xcarchive" \
            -exportPath "build/ios/ipa" \
            -exportOptionsPlist "$HOME/export_options.plist"
    artifacts:
      - $CM_BUILD_DIR/$PROJECT_DIR/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

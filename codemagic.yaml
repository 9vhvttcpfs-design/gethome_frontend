workflows:
  ios-workflow:
    name: GetHome iOS
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic Integration
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: online.trygethome.app
      vars:
        PROJECT_DIR: ".--"
        BUNDLE_ID: online.trygethome.app
        XCODE_SCHEME: App
        XCODE_WORKSPACE: ios/App/App.xcodeproj/project.xcworkspace
      node: 22.13.0
      xcode: 16.3
    cache:
      cache_paths:
        - $CM_BUILD_DIR/$PROJECT_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npm ci
      - name: Build Vite web app
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npm run build
      - name: Capacitor sync
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          npx cap sync ios
      - name: Set bundle version
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR/ios/App"
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          agvtool new-version -all $(($LATEST_BUILD + 1))
      - name: Set up code signing settings on Xcode project
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          xcode-project use-profiles
      - name: Archive
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "-destination 'generic/platform=iOS'"

      - name: Inspect archive and export IPA
        script: |
          cd "$CM_BUILD_DIR/$PROJECT_DIR"
          ARCHIVE_PATH="build/ios/xcarchive/App.xcarchive"

          echo "=== Archive Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" "$ARCHIVE_PATH/Info.plist"

          echo "=== Archive contents ==="
          find "$ARCHIVE_PATH/Products/Applications" -maxdepth 2 -print

          echo "=== App Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print" \
            "$ARCHIVE_PATH/Products/Applications/App.app/Info.plist"

          echo "=== Starting export ==="
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --skip-archive
    artifacts:
      - /tmp/xcodebuild_logs/**
      - build/ios/xcarchive/**
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
